
services:
    database:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: app
            MYSQL_USER: app
            MYSQL_PASSWORD: "PLACEHOLDER_APP_SECRET!"
            MYSQL_ROOT_PASSWORD: "PLACEHOLDER_ROOT_SECRET"
        ports:
            - "3307:3306"
        volumes:
            - database_data:/var/lib/mysql

volumes:
    database_data: